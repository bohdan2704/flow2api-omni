services:
  flow2api:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    volumes:
      - flow2api_data:/app/data
      - flow2api_tmp:/app/tmp
      - type: bind
        source: /opt/flow2api/setting.toml
        target: /app/config/setting.toml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  flow2api_data:
  flow2api_tmp:
